<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IA Princesse V13.1 PRO · Openi.ia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060d;--glass:rgba(20,22,42,.72);--glass2:rgba(28,30,56,.66);--line:rgba(255,255,255,.10);
  --text:#f4f2ff;--muted:#9a9ac4;--pink:#ff4ecd;--violet:#8b5cff;--cyan:#31e6ff;--gold:#ffd36e;--danger:#ff5f7a;
  --grad:linear-gradient(135deg,#ff4ecd,#8b5cff 45%,#31e6ff);
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05060d}}
:root[data-theme="dark"]{--bg:#05060d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-30%;z-index:-2;
  background:radial-gradient(45% 40% at 20% 20%,rgba(255,78,205,.28),transparent 60%),
             radial-gradient(45% 40% at 80% 10%,rgba(139,92,255,.30),transparent 60%),
             radial-gradient(50% 45% at 60% 90%,rgba(49,230,255,.20),transparent 60%);
  filter:blur(40px);animation:aurora 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;opacity:.5}
@keyframes aurora{0%{transform:translate3d(-3%,-2%,0) scale(1)}100%{transform:translate3d(4%,3%,0) scale(1.15)}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
h1,h2,h3,.brand,.title,.logo{font-family:Outfit,Inter,sans-serif}
.gr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== AUTH ===== */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.auth-card{width:min(440px,100%);background:var(--glass);backdrop-filter:blur(26px);border:1px solid var(--line);
  border-radius:28px;padding:28px;box-shadow:0 40px 120px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12)}
.logo{text-align:center;font-size:clamp(28px,7vw,38px);font-weight:900;letter-spacing:-.5px}
.crown{display:block;text-align:center;font-size:44px;filter:drop-shadow(0 6px 22px rgba(255,78,205,.6));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sub{text-align:center;color:var(--muted);margin:8px 0 20px;font-size:14px}
.tabs{display:flex;gap:8px;background:rgba(0,0,0,.3);padding:5px;border-radius:15px;border:1px solid var(--line)}
.tabs button{flex:1;border-radius:11px;padding:11px;color:var(--muted);font-weight:600;transition:.2s}
.tabs button.active{background:var(--grad);color:#0a0715;box-shadow:0 8px 24px rgba(139,92,255,.4)}
.field{width:100%;margin-top:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);outline:0;transition:.2s}
.field:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,255,.18)}
.field::placeholder{color:#6f6f9c}
.pwwrap{position:relative}
.pwwrap .field{padding-right:44px}
.pwtoggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);padding:7px 9px;border-radius:9px;color:var(--muted);font-size:15px;line-height:1}
.pwtoggle:hover{background:rgba(255,255,255,.08);color:#fff}
.pwstrength{height:4px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.pwstrength i{display:block;height:100%;width:0;border-radius:3px;transition:width .2s,background .2s}
.mainbtn{border-radius:14px;padding:13px 18px;background:var(--grad);color:#0a0715;font-weight:800;
  box-shadow:0 10px 30px rgba(139,92,255,.35);transition:transform .15s,filter .2s}
.mainbtn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.ghost{border-radius:14px;padding:11px 16px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600}
.ghost:hover{background:rgba(255,255,255,.13)}
.dangerbtn{background:linear-gradient(135deg,#ff5f7a,#c0304a);color:#fff}
.full{width:100%;margin-top:16px}
.msg{min-height:18px;color:var(--danger);font-size:13px;text-align:center;margin-top:10px}

/* ===== APP ===== */
.app{min-height:100dvh;display:flex}
.side{width:262px;flex:none;padding:18px 14px;display:flex;flex-direction:column;gap:3px;
  background:rgba(10,10,24,.72);backdrop-filter:blur(22px);border-right:1px solid var(--line)}
.brand{font-size:21px;font-weight:900;padding:6px 10px 20px;display:flex;align-items:center;justify-content:space-between}
.nav{width:100%;text-align:left;padding:12px 14px;border-radius:14px;color:#b6b6dd;font-weight:600;
  display:flex;gap:10px;align-items:center;border:1px solid transparent;transition:.18s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.active{background:linear-gradient(90deg,rgba(255,78,205,.22),rgba(139,92,255,.16));border-color:rgba(255,78,205,.35);color:#fff}
.nav .dot{margin-left:auto;font-size:11px;color:var(--cyan)}
.logout{margin-top:auto;color:#ff8ea0}
.content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;
  background:rgba(8,8,20,.6);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.title{font-size:20px;font-weight:800}
.small{font-size:12.5px;color:var(--muted)}
.section{padding:20px;display:grid;gap:16px;max-width:980px;width:100%;margin:0 auto}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(18px)}
.item{background:var(--glass2);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px;font-weight:600}
.badge.ok{background:rgba(49,230,255,.14);border-color:rgba(49,230,255,.4);color:var(--cyan)}
.menu{display:none}
.overlay{display:none}

/* ===== CHAT ===== */
.chat-wrap{flex:1;overflow-y:auto;padding:22px;position:relative}
.chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:82%;padding:14px 17px;border-radius:20px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
  animation:pop .25s ease;font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.bubble.me{align-self:flex-end;background:var(--grad);color:#0a0715;font-weight:500;border-bottom-right-radius:7px}
.bubble.ai{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:7px}
.bubble code{background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;font-size:13px}
.bubble pre{background:rgba(0,0,0,.5);padding:12px;border-radius:12px;overflow-x:auto;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.8}
.composer{padding:14px 18px 20px;background:linear-gradient(transparent,rgba(5,6,13,.9) 30%);position:sticky;bottom:0}
.composerRow{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:9px;backdrop-filter:blur(18px)}
textarea#input{flex:1;height:46px;max-height:150px;resize:none;border:0;background:transparent;outline:0;padding:12px}
.send{border-radius:16px;padding:12px 20px}
.status{max-width:860px;margin:0 auto 9px;font-size:12.5px;color:var(--muted);text-align:center}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--pink);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s;background:var(--violet)}
.typing span:nth-child(3){animation-delay:.4s;background:var(--cyan)}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* ===== KEY / LOCK ===== */
.lock{max-width:560px;margin:8vh auto;text-align:center}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(15px,4vw,21px);font-weight:700;letter-spacing:2px;
  padding:18px;border-radius:18px;background:rgba(0,0,0,.45);border:1px dashed rgba(255,78,205,.5);word-break:break-all}
.keyring{display:grid;gap:10px}
.spark{position:relative;overflow:hidden}
.spark::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);
  transform:translateX(-120%);animation:shine 2.6s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.plan{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.plan.plus{border-color:rgba(139,92,255,.5)}
.plan.ultra{border-color:rgba(255,211,110,.55);background:linear-gradient(160deg,rgba(255,211,110,.10),var(--glass))}
.price{font-size:26px;font-weight:900;margin:8px 0}
.plan ul{list-style:none;padding:0;margin:12px 0;color:var(--muted);font-size:14px;line-height:2}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.bottom{display:none}

@media(max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;z-index:60;transform:translateX(-102%);transition:.28s}
  .side.open{transform:none}
  .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;opacity:0;pointer-events:none;transition:.28s}
  .overlay.show{opacity:1;pointer-events:auto}
  .menu{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;z-index:30;
    background:rgba(8,8,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 4px}
  .bottom button{font-size:10.5px;color:var(--muted);display:grid;gap:3px;padding:7px 2px;border-radius:12px}
  .bottom button.active{color:#fff;background:rgba(255,78,205,.16)}
  .bottom span{font-size:18px}
  .bubble{max-width:92%}
  .composer{padding:10px 12px 12px}
}
table{width:100%;border-collapse:collapse}
body.gold{--pink:#ffd36e;--violet:#ff9f43;--cyan:#ffe9a8;--grad:linear-gradient(135deg,#ffd36e,#ff9f43 50%,#ffe9a8)}
body.gold .bubble.me{color:#241a00}
.chips{max-width:860px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.chip button{color:var(--danger);font-weight:800}
.bubble .att{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bubble .att img{width:120px;border-radius:12px;border:1px solid rgba(0,0,0,.2)}
.msgrow{display:flex;gap:10px;align-items:flex-end;max-width:100%;animation:pop .25s ease}
.msgrow.me{flex-direction:row-reverse}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  background:var(--glass2);border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.msgrow.me .avatar{background:var(--grad)}
.msgcol{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:82%}
.msgcol.me{align-items:flex-end}
.msgrow .bubble{animation:none}
.msgmeta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);padding:0 4px}
.msgmeta button{color:var(--muted);font-size:11px;display:inline-flex;gap:4px;align-items:center}
.msgmeta button:hover{color:#fff}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.suggest button{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:13px;color:var(--text);transition:.18s}
.suggest button:hover{border-color:rgba(255,78,205,.5);background:rgba(255,78,205,.1);transform:translateY(-1px)}
.scrollbtn{position:sticky;float:right;bottom:14px;right:14px;width:38px;height:38px;border-radius:50%;
  background:var(--glass);border:1px solid var(--line);display:none;place-items:center;font-size:15px;
  backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:15}
.scrollbtn.show{display:grid}
.composerRow:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,255,.16)}
.preview{width:100%;height:420px;border:1px solid var(--line);border-radius:18px;background:#fff}
.artbox{display:grid;place-items:center;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:260px}
.artbox svg{max-width:100%;height:auto}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gal .artbox{min-height:150px;padding:8px;cursor:pointer}
.conn{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--glass2);border:1px solid var(--line);margin-top:10px}
.conn .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:rgba(255,255,255,.08);flex:none}
.conn .info{flex:1;min-width:0}.conn .info span{display:block;font-size:12px;color:var(--muted)}
.lvl{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,211,110,.16);border:1px solid rgba(255,211,110,.45);color:var(--gold);font-weight:700}
.scrollx{overflow-x:auto}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth">
  <div class="auth-card">
    <span class="crown">👑</span>

      <button id="forgotSend" class="mainbtn full" type="button">📧 Envoyer le lien de réinitialisation</button>

      </div>
      <button id="resetGo" class="mainbtn full" type="button">🔒 Changer le mot de passe</button>
      <div id="resetMsg" class="msg"></div>
    </div>

    <div class="small" style="text-align:center;margin-top:10px">🔐 Ton compte reste sur cet appareil. Aucun serveur nécessaire.</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside id="side" class="side">
    <div class="brand"><span>👑 <span class="gr">Openi.ia</span></span><button id="sideClose" class="ghost" style="padding:4px 10px">✕</button></div>
    <button class="nav active" data-page="chat">💬 Discussion</button>
    <button class="nav" data-page="code">⌘ Princesse IA Code</button>

    <button class="nav" data-page="images">🎨 Créer une image</button>
    <button class="nav" data-page="sites">🌐 Créer un site</button>
    <button class="nav" data-page="games">🕹️ Créer un jeu</button>
    <button class="nav" data-page="connect">🔗 Connexions</button>
    <button class="nav" data-page="plans">✨ Abonnement</button>
    <button class="nav" data-page="claude">🗝️ Mode Claude</button>

</div>

<script type="text/plain" id="tpl-roblox">--[[  IA PRINCESSE - Plugin Roblox Studio  (Openi.ia · forfait Ultra)
      1. Studio > Game Settings > Security > Allow HTTP Requests : ON
      2. Enregistre ce fichier dans le dossier Plugins de Studio
      3. Au 1er clic, Studio demande l'autorisation d'acces a localhost : Accepte
         (cette autorisation est limitee a ce serveur local, rien d'autre
         n'est partage avec Openi.ia)
      4. Une fois active, le plugin affiche En ligne / Hors ligne et
         construit automatiquement dans la place ouverte ce que tu demandes
         a l'IA depuis le site (onglet Roblox > Construire en direct).
--]]
local HttpService = game:GetService("HttpService")
local BASE = "http://localhost:8787"          -- serveur local Openi.ia
local CLE = ""                                -- colle ici ta cle OPENI-...

local toolbar = plugin:CreateToolbar("IA Princesse")
local bouton = toolbar:CreateButton("IA Princesse", "Ouvrir IA Princesse", "rbxassetid://4458901886")

local info = DockWidgetPluginGuiInfo.new(Enum.InitialDockState.Right, false, false, 320, 460, 280, 340)
local gui = plugin:CreateDockWidgetPluginGui("IAPrincesse", info)
gui.Title = "Roblox IA Sonnet 2.0"

local fond = Instance.new("Frame", gui)
fond.Size = UDim2.fromScale(1, 1)

local statut = Instance.new("TextLabel", fond)
statut.Size = UDim2.new(1, -20, 0, 24)

statut.BackgroundTransparency = 1
statut.TextXAlignment = Enum.TextXAlignment.Left
statut.Font = Enum.Font.SourceSansBold
statut.TextColor3 = Color3.fromRGB(255, 95, 122)
statut.Text = "🔴 Hors ligne"

local boite = Instance.new("TextBox", fond)
boite.Size = UDim2.new(1, -20, 0, 80)
boite.Position = UDim2.new(0, 10, 0, 36)
boite.MultiLine = true
boite.ClearTextOnFocus = false
boite.PlaceholderText = "Ex : un script qui fait sauter le joueur 2x plus haut"
boite.TextColor3 = Color3.new(1, 1, 1)
boite.BackgroundColor3 = Color3.fromRGB(26, 26, 48)
boite.TextWrapped = true
boite.TextXAlignment = Enum.TextXAlignment.Left

local envoyer = Instance.new("TextButton", fond)
envoyer.Size = UDim2.new(1, -20, 0, 34)
envoyer.Position = UDim2.new(0, 10, 0, 122)
envoyer.Text = "Generer un script"
envoyer.TextColor3 = Color3.new(0, 0, 0)
envoyer.BackgroundColor3 = Color3.fromRGB(255, 120, 210)

local sortie = Instance.new("TextLabel", fond)

-- Construit dans Workspace la liste d'objets renvoyée par le site (ex : "un arbre")
local function construire(id, objets)
	local model = Instance.new("Model")
	model.Name = "IA_Construction_" .. tostring(id)
	model.Parent = workspace

	local formes = {
		Part = Enum.PartType.Block,
		Ball = Enum.PartType.Ball,
		Cylinder = Enum.PartType.Cylinder,
	}

	local total = 0
	for _, o in ipairs(objets) do
		local okObj = pcall(function()
			local part = Instance.new("Part")
			part.Shape = formes[o.shape] or Enum.PartType.Block
			part.Size = Vector3.new(o.size[1] or 2, o.size[2] or 2, o.size[3] or 2)
			part.CFrame = CFrame.new(o.position[1] or 0, o.position[2] or 0, o.position[3] or 0)
			part.Color = Color3.fromRGB(o.color and o.color[1] or 150, o.color and o.color[2] or 150, o.color and o.color[3] or 150)
			part.Anchored = true
			part.Name = o.name or "Objet"
			if o.material then
				pcall(function() part.Material = Enum.Material[o.material] end)
			end
			part.Parent = model
		end)
		if okObj then total = total + 1 end
	end

	sortie.Text = "🌳 Construction reçue du site : " .. total .. " objet(s) placés dans Workspace > " .. model.Name
end

				for _, build in ipairs(data.builds) do

				end
			end
		else
			enLigne(false)
		end
		task.wait(3)
	end
end)

<script type="text/plain" id="tpl-server">/*  Openi.ia - serveur local (Google + Roblox Studio)
    1) npm init -y && npm i express cors node-fetch@2 googleapis
    2) mets tes cles dans les variables ci-dessous
    3) node openi_server.js   -> http://localhost:8787
*/
const express = require('express');
const cors = require('cors');
const fetch = require('node-fetch');
const { google } = require('googleapis');

const PORT = 8787;
const ANTHROPIC_KEY = process.env.ANTHROPIC_API_KEY || 'sk-ant-...'; // IA générale
const ROBLOX_ANTHROPIC_KEY = process.env.ROBLOX_ANTHROPIC_API_KEY || ANTHROPIC_KEY; // IA Roblox séparée possible
const ROBLOX_MODEL = process.env.ROBLOX_AI_MODEL || 'claude-sonnet-4-6'; // nom affiché : Sonnet 2.0
const GOOGLE_ID     = process.env.GOOGLE_CLIENT_ID || '....apps.googleusercontent.com';
const GOOGLE_SECRET = process.env.GOOGLE_CLIENT_SECRET || '...';
const REDIRECT      = `http://localhost:${PORT}/auth/google/callback`;

const app = express();
app.use(cors());
app.use(express.json({ limit: '10mb' }));

let googleTokens = null; // en vrai : range ca par utilisateur dans une base

const oauth = () => new google.auth.OAuth2(GOOGLE_ID, GOOGLE_SECRET, REDIRECT);

// ---- Google : demander l'autorisation ----
app.get('/auth/google', (req, res) => {
  const url = oauth().generateAuthUrl({
    access_type: 'offline',
    prompt: 'consent',
    scope: [
      'https://www.googleapis.com/auth/userinfo.email',
      'https://www.googleapis.com/auth/gmail.readonly',
      'https://www.googleapis.com/auth/drive.readonly',
      'https://www.googleapis.com/auth/calendar.readonly'
    ]
  });
  res.redirect(url);
});

app.get('/auth/google/callback', async (req, res) => {
  const client = oauth();
  const { tokens } = await client.getToken(req.query.code);
  googleTokens = tokens;
  res.send('<h2>Google connecte a Openi.ia. Tu peux fermer cette fenetre.</h2>');
});

app.get('/api/google/status', (req, res) => res.json({ connected: !!googleTokens }));

app.get('/api/google/mails', async (req, res) => {
  if (!googleTokens) return res.status(401).json({ error: 'non connecte' });
  const client = oauth(); client.setCredentials(googleTokens);
  const gmail = google.gmail({ version: 'v1', auth: client });
  const list = await gmail.users.messages.list({ userId: 'me', maxResults: 10 });
  const msgs = [];
  for (const m of list.data.messages || []) {
    const d = await gmail.users.messages.get({ userId: 'me', id: m.id, format: 'metadata' });
    const h = Object.fromEntries((d.data.payload.headers || []).map(x => [x.name, x.value]));
    msgs.push({ de: h.From, sujet: h.Subject, date: h.Date, apercu: d.data.snippet });
  }
  res.json({ mails: msgs });
});

// ---- IA (utilise par le site ET par le plugin Roblox Studio) ----
app.post('/api/ia', async (req, res) => {
  const { prompt, mode, history } = req.body || {};
  const systeme = mode === 'roblox-lua'
    ? "Tu es IA Princesse, creee par Tissou. Ecris UNIQUEMENT du code Lua pour Roblox Studio, sans explication ni balises markdown."
    : "Tu es IA Princesse, une assistante creee par Tissou. Reponds en francais.";
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': ANTHROPIC_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2000,
        system: systeme,
        messages: [...(history || []), { role: 'user', content: prompt }]
      })
    });
    const d = await r.json();
    res.json({ text: (d.content || []).map(c => c.text || '').join('\n') });
  } catch (e) {
    res.status(500).json({ error: String(e) });
  }
});

/* =========================================================
   ROBLOX IA — SONNET 2.0
   Endpoint totalement séparé de /api/ia.
   Utilise une clé et un modèle configurables séparément.
   ========================================================= */
// Les variables ROBLOX_ANTHROPIC_KEY / ROBLOX_MODEL sont définies plus haut.

app.post('/api/roblox-ai', async (req, res) => {
  const { prompt, history } = req.body || {};
  if (!prompt || !String(prompt).trim()) {
    return res.status(400).json({ error: 'Prompt Roblox manquant.' });
  }

  const systeme = `Tu es Roblox IA Sonnet 2.0, une IA spécialisée UNIQUEMENT
dans Roblox Studio et Luau. Tu es indépendante de l'IA générale Openi.ia.

RÈGLES :
- Génère du Luau prêt à utiliser dans Roblox Studio.
- Précise l'emplacement du script si nécessaire (ServerScriptService,
  StarterPlayerScripts, StarterGui, ReplicatedStorage, etc.).
- Respecte les services, RemoteEvents, RemoteFunctions et APIs Roblox.
- Pour une demande de correction, renvoie le code corrigé.
- Pour une demande d'explication, explique clairement puis donne le code
  si cela est utile.
- N'affirme jamais avoir exécuté ou testé le script.
- Évite les balises markdown quand la demande est explicitement "code seul".
- Ne réponds pas aux demandes sans rapport avec Roblox Studio.`;

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': ROBLOX_ANTHROPIC_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: ROBLOX_MODEL,
        max_tokens: 5000,
        system: systeme,
        messages: [...(history || []), { role: 'user', content: String(prompt) }]
      })
    });

    const d = await r.json();
    if (!r.ok) {
      return res.status(r.status).json({
        error: d?.error?.message || 'Erreur de Roblox IA.'
      });
    }

    res.json({
      text: (d.content || []).map(c => c.text || '').join('\n'),
      model: ROBLOX_MODEL
    });
  } catch (e) {
    res.status(500).json({ error: String(e) });
  }
});

/* =========================================================
   ROBLOX — connexion en direct (forfait Ultra)
   Le site web envoie une demande ("un arbre"), le serveur
   demande à l'IA une liste d'objets simples, et le plugin
   Roblox Studio va chercher cette liste (polling) pour la
   construire directement dans la place ouverte.
   ========================================================= */
let robloxLastPing = 0;      // dernier signal reçu du plugin Studio
let robloxQueue = [];        // constructions en attente à envoyer au plugin

app.post('/api/roblox/heartbeat', (req, res) => {
  robloxLastPing = Date.now();
  res.json({ ok: true });
});

app.get('/api/roblox/status', (req, res) => {
  res.json({ online: (Date.now() - robloxLastPing) < 8000 });
});

app.get('/api/roblox/poll', (req, res) => {
  robloxLastPing = Date.now(); // le plugin qui vient chercher = plugin en ligne
  const batch = robloxQueue;
  robloxQueue = [];
  res.json({ builds: batch });
});

app.post('/api/roblox/build', async (req, res) => {
  const { prompt } = req.body || {};
  if (!prompt || !String(prompt).trim()) {
    return res.status(400).json({ error: 'Décris ce qu\'il faut construire.' });
  }
  const systeme = `Tu transformes une demande en une petite scène 3D pour Roblox Studio.
Réponds UNIQUEMENT avec un JSON valide, sans aucun texte autour ni balises markdown, au format exact :
{"objects":[{"shape":"Part","size":[4,1,4],"position":[0,0.5,0],"color":[120,72,40],"material":"Wood","name":"Tronc"}]}
Règles :
- "shape" vaut "Part" (bloc), "Ball" (sphère) ou "Cylinder".
- "size" et "position" sont des nombres en studs, "position" est le centre de l'objet.
- "color" est du RGB 0-255.
- "material" est un nom d'Enum.Material Roblox (Wood, Grass, Plastic, Slate, ...), optionnel.
- Maximum 40 objets.
- Pose la scène au sol autour de (0, y, 0), avec Y adapté à la demi-hauteur de chaque objet.`;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': ROBLOX_ANTHROPIC_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: ROBLOX_MODEL,
        max_tokens: 2000,
        system: systeme,
        messages: [{ role: 'user', content: String(prompt) }]
      })
    });
    const d = await r.json();
    if (!r.ok) return res.status(r.status).json({ error: d?.error?.message || 'Erreur IA.' });
    const raw = (d.content || []).map(c => c.text || '').join('\n').trim();
    const cleaned = raw.replace(/^```json\s*|```$/g, '').trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); } catch { parsed = { objects: [] }; }
    const objects = Array.isArray(parsed.objects) ? parsed.objects.slice(0, 40) : [];
    if (!objects.length) return res.status(422).json({ error: 'L\'IA n\'a pas réussi à décrire cette construction, réessaie avec une phrase plus simple.' });
    const id = Date.now();
    robloxQueue.push({ id, objects });
    res.json({ ok: true, id, count: objects.length, online: (Date.now() - robloxLastPing) < 8000 });
  } catch (e) {
    res.status(500).json({ error: String(e) });
  }
});

app.listen(PORT, () => console.log('Openi.ia sur http://localhost:' + PORT));
</script>
<script>

/* ---------- moteur IA gratuit intégré (Puter.js, aucune clé requise) ---------- */
function noEngineMsg(){
  return location.protocol==='file:'
    ? 'Moteur gratuit indisponible en ouvrant le fichier en double-clic (protocole non supporté). Héberge le fichier sur un vrai site (même gratuit), ou ajoute ta clé perso dans ⚙️ Paramètres.'
    : 'Moteur indisponible, vérifie ta connexion internet.';
}
let puterReady=null;
function loadPuter(){
  if(location.protocol==='file:')return Promise.reject(new Error('unsupported_protocol'));
  if(window.puter)return Promise.resolve(window.puter);
  if(puterReady)return puterReady;
  puterReady=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://js.puter.com/v2/';
    s.onload=()=>resolve(window.puter||null);
    s.onerror=()=>reject(new Error('Moteur gratuit indisponible (connexion bloquée).'));
    document.head.appendChild(s);
  });
  return puterReady;
}
function puterText(r){
  const c=r?.message?.content;
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(x=>x?.text||'').join('');
  return typeof r==='string'?r:'';
}
function makePuterEngine(p){
  return async function(messages,opts={}){
    const normalizedMessages=Array.isArray(messages)
      ? messages.filter(Boolean).map(m=>({role:m.role||'user',content:typeof m.content==='string'?m.content:String(m.content??'')}))
      : [{role:'user',content:String(messages??'')}];
    if(!normalizedMessages.length) normalizedMessages.push({role:'user',content:''});
    try{
      const stream=await p.ai.chat(normalizedMessages,false,{stream:true});
      let full='';
      for await(const part of stream){
        if(opts.signal?.aborted)throw Object.assign(new Error('cancelled'),{code:'cancelled'});
        const chunk=part?.text ?? part?.choices?.[0]?.delta?.content ?? '';
        if(chunk){full+=chunk;opts.onText?.({text:full})}
      }
      if(!full)throw new Error('vide');
      return {text:full};
    }catch(e){
      if(e?.code==='cancelled')throw e;
      const r=await p.ai.chat(normalizedMessages,false,{});
      const text=puterText(r);
      if(!text)throw new Error('Le moteur gratuit n\'a renvoyé aucun texte, réessaie.');
      opts.onText?.({text});return {text};
    }
  };
}
/* ---------- moteur IA à clé perso (avancé, optionnel) ---------- */
function makeKeyEngine(cfg){
  return async function(messages,opts={}){
    const normalizedMessages=Array.isArray(messages)
      ? messages.filter(Boolean).map(m=>({role:m.role||'user',content:typeof m.content==='string'?m.content:String(m.content??'')}))

      });
      let d={};try{d=await r.json()}catch{}

      if(!text) throw new Error('Gemini n\'a renvoyé aucun texte. Vérifie la clé AI Studio et ses restrictions.');
      opts.onText?.({text});return {text};
    }

    let url,model,headers={'Content-Type':'application/json','Authorization':'Bearer '+cfg.key};
    if(provider==='openrouter'){
      // plusieurs modèles gratuits en secours : si l'un est saturé, payant, retiré ou renommé, on essaie le suivant automatiquement
      const orModels=['meta-llama/llama-3.1-8b-instruct:free','google/gemini-2.0-flash-exp:free','qwen/qwen-2.5-72b-instruct:free','mistralai/mistral-7b-instruct:free','deepseek/deepseek-chat:free','meta-llama/llama-3.3-70b-instruct:free','openrouter/free'];
      const orHeaders={'Content-Type':'application/json','Authorization':'Bearer '+cfg.key,'HTTP-Referer':location.href,'X-Title':'IA Princesse'};
      let lastMsg='';

          body:JSON.stringify({model:m,messages:normalizedMessages,temperature:0.7}),signal:opts.signal}); }
        catch(e){ if(opts.signal?.aborted)throw e; lastMsg=e.message||'Erreur réseau'; continue }
        let d={};try{d=await r.json()}catch{}
        if(r.ok){
          const text=d?.choices?.[0]?.message?.content||'';
          if(text){ opts.onText?.({text}); return {text} }
          lastMsg='Réponse vide';continue;
        }
        lastMsg=d?.error?.message||`API ${r.status}`;
        // clé invalide/refusée : on arrête tout de suite, ce n'est pas la peine d'essayer les autres modèles
        if(r.status===401||r.status===403)throw new Error('Clé API refusée. Vérifie qu\'elle est correcte et active dans ⚙️ Paramètres.');
        continue; // toute autre erreur (saturé, payant, modèle retiré/renommé, etc.) -> on tente le modèle suivant
      }
      throw new Error('Les modèles gratuits sont très demandés en ce moment 😮\u200d💨. Réessaie dans une minute, ou ajoute une clé OpenAI, Gemini, Groq ou Mistral dans ⚙️ Paramètres pour un accès plus stable.');
    } else if(provider==='openai'){
      url='https://api.openai.com/v1/chat/completions';model='gpt-5.1';
    } else if(provider==='groq'){

      const system=normalizedMessages.filter(m=>m.role==='system').map(m=>m.content).join('\n');

      const body={model,max_tokens:2048,messages:msgs};if(system)body.system=system;
      const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
      let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error?.message||`Anthropic ${r.status}`);
      const text=d?.content?.map(x=>x.text||'').join('')||'';if(!text)throw new Error('Anthropic n\'a renvoyé aucun texte.');opts.onText?.({text});return {text};
    } else throw new Error('Fournisseur IA inconnu.');

    const body={model,messages:normalizedMessages,temperature:0.7};
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d?.error?.message||`API ${r.status}`);
    const text=d?.choices?.[0]?.message?.content||'';

function resetEngine(){sampleFn=undefined}
async function engine(){

/* ---------- hachage sécurisé du mot de passe (fonctionne même hors ligne / fichier local, sans HTTPS) ---------- */
function utf8Bin(str){return unescape(encodeURIComponent(str))}
function sha256Sync(ascii){
  function rightRotate(value,amount){return (value>>>amount)|(value<<(32-amount))}
  var mathPow=Math.pow,maxWord=mathPow(2,32),lengthProperty='length',i,j,result='';
  var words=[],asciiBitLength=ascii[lengthProperty]*8;
  var hash=sha256Sync.h=sha256Sync.h||[];
  var k=sha256Sync.k=sha256Sync.k||[];
  var primeCounter=k[lengthProperty];
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii[lengthProperty]%64-56)ascii+='\x00';
  for(i=0;i<ascii[lengthProperty];i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return null;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]]=(asciiBitLength);
  for(j=0;j<words[lengthProperty];){
    var w=words.slice(j,j+=16);
    var oldHash=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(
            w[i-16]
            +(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
            +w[i-7]
            +(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10))
          )|0
        );
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result;
}
async function sha256Hex(str){
  if(window.crypto?.subtle?.digest){
    try{
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }catch(e){/* pas de contexte sécurisé (ex: fichier ouvert en local) → repli ci-dessous */}
  }
  return sha256Sync(utf8Bin(str));
}
function randomSalt(len){
  len=len||16;
  try{
    const arr=new Uint8Array(len);
    (window.crypto||window.msCrypto).getRandomValues(arr);
    return [...arr].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let s='';for(let i=0;i<len*2;i++)s+=Math.floor(Math.random()*16).toString(16);
    return s;
  }
}
// dérivation salée + répétée : ralentit une attaque par force brute sur les données stockées localement
async function hashPw(pw,salt){
  let h=salt+'::'+pw;
  for(let i=0;i<1500;i++)h=await sha256Hex(h+'::'+salt+'::'+i%97);
  return h;
}
// vérifie un mot de passe contre un utilisateur, en migrant en douceur les anciens comptes (V13.0 et avant, hash simple non salé)
async function verifyPw(pw,u){
  if(u.salt&&u.hashVer>=2){
    return (await hashPw(pw,u.salt))===u.pass;
  }
  // ancien format : SHA-256 simple sans sel — on vérifie puis on migre immédiatement
  const legacy=await sha256Hex(pw);
  if(legacy===u.pass){u._needsMigration=true;return true}
  return false;
}
async function setPw(u,pw){
  u.salt=randomSalt();u.pass=await hashPw(pw,u.salt);u.hashVer=2;
}

const LOGIN_LOCK='openi_login_attempts';
function attemptsFor(email){const all=LS(LOGIN_LOCK,{});return all[email]||{n:0,until:0}}
function registerFail(email){const all=LS(LOGIN_LOCK,{});const a=all[email]||{n:0,until:0};a.n++;
  if(a.n>=5){a.until=Date.now()+60000;a.n=0}all[email]=a;SET(LOGIN_LOCK,all)}

/* ---------- indicateur de robustesse du mot de passe (à la création de compte) ---------- */
function pwScore(pw){
  let s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;if(/\d/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;
  return Math.min(s,4);
}

  msg.style.color='var(--danger)';msg.textContent='';
  const email=$('email').value.trim().toLowerCase(),pw=$('password').value,pseudo=$('pseudo').value.trim();
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='Entre une adresse email valide.';return}
  if(!pw||pw.length<8){msg.textContent='Le mot de passe doit faire au moins 8 caractères.';return}
  btn.disabled=true;const oldLabel=btn.textContent;btn.textContent=signup?'Création…':'Connexion…';

      const u={id:uid(),email,pseudo:pseudo||email.split('@')[0],plan:'free',planName:'Gratuit',created:Date.now()};

      if(lock.until>Date.now()){msg.textContent=`Trop d'essais. Réessaie dans ${Math.ceil((lock.until-Date.now())/1000)} s.`;return}
      const u=users.find(u=>u.email===email);

      if(!ok){registerFail(email);msg.textContent='Email ou mot de passe incorrect.';return}

}

        place:parts.length>1?parts.slice(0,-1).join(' > '):'Roblox Studio',

      for(const m of String(text).matchAll(/```(?:lua|luau)\s*([\s\S]*?)```/gi)){

function cleanSvg(c){c=c.slice(c.indexOf('<svg'));return c.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+\s*=\s*"[^"]*"/gi,'')}
function fmt(t){
  const svgs=[],htmls=[];
  let x=String(t??'')
    .replace(/```(?:svg|xml)?\s*(<svg[\s\S]*?<\/svg>)\s*```/gi,(_,c)=>{svgs.push(cleanSvg(c));return '\u0000S'+(svgs.length-1)+'\u0000'})
    .replace(/(^|\n)\s*(<svg[\s\S]*?<\/svg>)/gi,(_,a,c)=>{svgs.push(cleanSvg(c));return a+'\u0000S'+(svgs.length-1)+'\u0000'})
    .replace(/```html\s*([\s\S]*?)```/gi,(_,c)=>{htmls.push(c.trim());return '\u0000H'+(htmls.length-1)+'\u0000'});
  x=esc(x)
    .replace(/```([\s\S]*?)```/g,(_,c)=>`<pre>${c.trim()}</pre>`)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')

/* ---------- mémoire longue (résumé glissant) + lecture web ---------- */
const MSG_WINDOW=40,SUMMARY_EVERY=20;
async function maybeSummarize(c,fn){
  if(c.messages.length<SUMMARY_EVERY)return;
  const last=c.summarizedAt||0;
  if(c.messages.length-last<SUMMARY_EVERY)return;
  const toSummarize=c.messages.slice(0,c.messages.length-14);
  if(!toSummarize.length)return;
  try{
    const convText=toSummarize.map(m=>(m.role==='user'?'Utilisateur':'IA')+': '+(m.text||'').slice(0,600)).join('\n').slice(0,16000);
    const r=await fn(`Résume cette conversation de façon concise mais complète (informations importantes, préférences exprimées, décisions prises, contexte à retenir), en 10 à 15 lignes maximum, en français, à la 3e personne. Réponds UNIQUEMENT avec le résumé, sans commentaire ni balises.

${c.summary?('Résumé précédent à mettre à jour :\n'+c.summary+'\n\nNouveaux échanges à intégrer :\n'):'Conversation à résumer :\n'}${convText}`,{modelTier:tier(),cache:false});
    const s=(r.text||'').trim();
    if(s){c.summary=s;c.summarizedAt=c.messages.length;save();}
  }catch(e){/* pas grave, on retentera au prochain message */}
}
async function fetchWebContext(text){
  const m=(text||'').match(/https?:\/\/[^\s<>"')]+/);
  if(!m)return null;
  const url=m[0];
  const st=$('st');if(st)st.innerHTML='🌍 Lecture de la page web…';
  try{
    const ctl2=new AbortController();const t=setTimeout(()=>ctl2.abort(),9000);
    const r=await fetch('https://r.jina.ai/'+url,{signal:ctl2.signal});
    clearTimeout(t);
    if(!r.ok)return null;
    const txt=(await r.text()).slice(0,6000).trim();
    return txt?{url,text:txt}:null;
  }catch(e){return null}
}
async function send(){
  if(busy)return;
  const i=$('input'),text=i.value.trim();const sending=atts.slice();
  if(!text&&!sending.length)return;
  const c=store.conversations.find(x=>x.id===currentConv);if(!c)return;
  if(!quota('chat',20)){$('st').textContent='⚠️ Crédits de discussion épuisés pour aujourd’hui. Ils reviennent demain.';return}
  const fn=await engine();
  if(!fn){$('st').textContent='⚠️ Le moteur IA n\'est pas disponible dans cette vue.';return}
  busy=true;i.value='';i.style.height='46px';atts=[];drawChips();
  const imgAtts=sending.filter(a=>!a.isDoc),docAtts=sending.filter(a=>a.isDoc);
  const msg={role:'user',text:text||(imgAtts.length?'(image)':'(fichier joint)'),imgs:imgAtts.map(a=>a.url),
    docs:docAtts.map(a=>({name:a.name,text:a.text})),time:Date.now()};
  c.messages.push(msg);
  if(c.messages.length===1)c.title=(text||(imgAtts.length?'Image':'Fichier')).slice(0,42);
  c.updated=Date.now();save();
  const chat=$('chat');
  if(chat.querySelector('.empty'))chat.innerHTML='';
  chat.insertAdjacentHTML('beforeend',bubble(msg));
  const outRow=document.createElement('div');outRow.className='msgrow ai';
  outRow.innerHTML=`<div class="avatar">👑</div><div class="msgcol ai"><div class="bubble ai"><span class="typing"><span></span><span></span><span></span></span></div><div class="msgmeta"></div></div>`;
  chat.appendChild(outRow);const out=outRow.querySelector('.bubble');scrollChat();
  $('send').disabled=true;$('st').innerHTML='👑 IA Princesse réfléchit…';

  const webCtx=await fetchWebContext(text);

  const input=[{role:'user',content:INSTR+(c.summary?`\n\nRésumé de ce qui a déjà été dit plus tôt dans cette conversation (mémoire longue) :\n${c.summary}`:'')+'\n\n(Réponds simplement "Prête 👑" à ce message d\'installation.)'},
               {role:'assistant',content:'Prête 👑'},
               ...c.messages.slice(-MSG_WINDOW).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text
                 +(m.imgs?.length?' [image envoyée]':'')
                 +(m.docs?.length?'\n\n'+m.docs.map(d=>`--- Fichier joint : ${d.name} ---\n${d.text}`).join('\n\n'):'')
                 +(m===msg&&webCtx?`\n\n--- Contenu lu sur la page web (${webCtx.url}) ---\n${webCtx.text}`:'')}))];
  let full='';ctl=new AbortController();
  const opts={signal:ctl.signal,cache:false,modelTier:tier(),onText:({text})=>{full=text;out.innerHTML=fmt(text);scrollChat()}};
  if(imgAtts.length){const lim=await fn.limits?.().catch(()=>null);
    if(lim?.images)opts.images=imgAtts.slice(0,lim.images.maxCount).map(a=>a.file);
    else $('st').textContent='⚠️ Les images ne sont pas acceptées dans cette vue.'}
  if(!$('st').textContent.startsWith('⚠️'))$('st').innerHTML='👑 IA Princesse réfléchit…';
  try{ const r=await fn(input,opts); full=r.text||full }
  catch(e){ full=e?.text||'';
    const map={not_granted:'Accès au moteur refusé. Recharge et accepte pour utiliser l\'IA.',
      rate_limited:'Trop de messages d\'un coup, attends quelques secondes.',cancelled:'Réponse arrêtée.',
      prompt_too_large:'La conversation est trop longue, ouvre une nouvelle discussion.'};
    $('st').textContent='⚠️ '+(map[e?.code]||e?.message||'Erreur du moteur.');
    if(!full)out.innerHTML=fmt('Je n\'ai pas pu répondre cette fois-ci. Réessaie dans un instant.') }
  if(full){
    const aiMsg={role:'assistant',text:full,time:Date.now()};
    out.innerHTML=fmt(full);
    const copyId=uid();MSGBIN[copyId]=full;
    outRow.querySelector('.msgmeta').innerHTML=`<span>${fmtTime(aiMsg.time)}</span><button class="copyMsg" data-copy="${copyId}">📋 Copier</button>`;
    c.messages.push(aiMsg);c.updated=Date.now();save();
    maybeSummarize(c,fn);
  }
  $('send').disabled=false;busy=false;if($('st').textContent.startsWith('👑'))$('st').textContent='';
  scrollChat();$('input')?.focus();
}

    <b>4.</b> Redémarre Studio, clique sur le bouton « IA Princesse ». Studio affiche sa fenêtre d'autorisation → <b>Accepte</b>.<br>
    <b>5.</b> Lance <code>node openi_server.js</code> (le même que pour Google), colle ta clé OPENI dans le plugin, et demande ton script.</div>`;

  const l=$('connList');
  l.innerHTML=APPS.map(a=>`<div class="conn"><div class="ico">${a.ico}</div>
    <div class="info"><b>${a.name}</b><span>${a.desc}</span></div>
    <button class="ghost" data-app="${a.id}">Serveur requis</button></div>`).join('');
  l.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{currentPage='chat';render();
    setTimeout(()=>{const i=$('input');if(i){i.value='Explique-moi comment connecter '+b.closest('.conn').querySelector('b').textContent+' à Openi.ia';i.focus()}},120)});
}

/* ---------- onglet Mode Claude (protégé par mot de passe) ---------- */
function pageClaudeMode(p){
  const K='openi_claude_unlock_'+key();
  const isUnlocked=localStorage.getItem(K)==='1';
  if(!isUnlocked){
    p.innerHTML=header('Mode Claude','Onglet protégé par mot de passe')+`<div class="section"><div class="card lock spark" style="text-align:center">
      <div style="font-size:52px">🗝️</div>
      <h2 style="margin:8px 0">Onglet protégé</h2>
      <p class="small" style="line-height:1.6">Entre le mot de passe pour accéder à cet onglet.</p>
      <input id="cpw" class="field" type="password" placeholder="Mot de passe" style="text-align:center">
      <div id="cmsg" class="msg"></div>
      <div class="row" style="justify-content:center"><button id="cgo" class="mainbtn">🔓 Déverrouiller</button></div>
    </div></div>`;
    $('cgo').onclick=()=>{
      if(($('cpw').value||'').trim().toLowerCase()==='claude'){localStorage.setItem(K,'1');render()}
      else{$('cmsg').textContent='Mot de passe incorrect.';$('cpw').value=''}
    };
    $('cpw').onkeydown=e=>{if(e.key==='Enter')$('cgo').click()};
    $('cpw').focus();
    return;
  }
  const msgs=store.claudeMsgs.filter(x=>x.userId===key());
  p.innerHTML=header('Mode Claude','Discussion directe, sans mise en scène',`<button id="claudeLock" class="ghost">🔒 Reverrouiller</button>`)
    +`<div class="chat-wrap"><div id="claudeChatBox" class="chat">${msgs.length?msgs.map(m=>bubble(m)).join(''):
      `<div class="empty">🗝️ Ici tu parles directement à Claude, sans le personnage IA Princesse.</div>`}</div></div>
     <div class="composer"><div id="cst" class="status"></div><div class="composerRow">
       <textarea id="claudeInput" placeholder="Écris ton message à Claude…"></textarea>
       <button id="claudeSend" class="mainbtn send">Envoyer</button></div></div>`;
  $('claudeLock').onclick=()=>{localStorage.removeItem(K);render()};
  const i=$('claudeInput');
  i.oninput=()=>{i.style.height='46px';i.style.height=Math.min(i.scrollHeight,150)+'px'};
  i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendClaude()}};
  $('claudeSend').onclick=sendClaude;
  const wrap=document.querySelector('.chat-wrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
  i.focus();
}
const CLAUDE_INSTR="Tu es Claude, l'assistant IA créé par Anthropic. Dans cet onglet précis (« Mode Claude »), tu réponds en ton nom propre, honnêtement : tu ne joues pas le personnage \"IA Princesse\" et tu ne prétends pas avoir été créé par \"Tissou\". Reste utile, clair, direct et fidèle à qui tu es réellement, en français sauf demande contraire.";
async function sendClaude(){
  if(busy)return;
  const i=$('claudeInput'),text=i.value.trim();if(!text)return;
  const fn=await engine(); if(!fn){$('cst').textContent='⚠️ Moteur IA indisponible dans cette vue.';return}
  busy=true;i.value='';i.style.height='46px';
  const msg={id:uid(),userId:key(),role:'user',text,time:Date.now()};
  store.claudeMsgs.push(msg);save();
  const box=$('claudeChatBox');if(box.querySelector('.empty'))box.innerHTML='';
  box.insertAdjacentHTML('beforeend',bubble(msg));
  const outRow=document.createElement('div');outRow.className='msgrow ai';
  outRow.innerHTML=`<div class="avatar">🗝️</div><div class="msgcol ai"><div class="bubble ai"><span class="typing"><span></span><span></span><span></span></span></div><div class="msgmeta"></div></div>`;
  box.appendChild(outRow);const out=outRow.querySelector('.bubble');
  const wrap=document.querySelector('.chat-wrap');if(wrap)wrap.scrollTop=wrap.scrollHeight;
  $('claudeSend').disabled=true;$('cst').textContent='⏳ Claude réfléchit…';
  const hist=store.claudeMsgs.filter(x=>x.userId===key()).slice(-24).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
  let full='';ctl=new AbortController();
  try{
    const r=await fn([{role:'user',content:CLAUDE_INSTR},{role:'assistant',content:'Compris.'},...hist],
      {signal:ctl.signal,cache:false,modelTier:tier(),onText:({text})=>{full=text;out.innerHTML=fmt(text);if(wrap)wrap.scrollTop=wrap.scrollHeight}});
    full=r.text||full;
  }catch(e){ full=e?.text||''; $('cst').textContent='⚠️ '+(e.message||'Erreur du moteur.');
    if(!full)out.innerHTML=fmt("Je n'ai pas pu répondre cette fois-ci. Réessaie dans un instant."); }
  if(full){
    const aiMsg={id:uid(),userId:key(),role:'assistant',text:full,time:Date.now()};
    out.innerHTML=fmt(full);
    const copyId=uid();MSGBIN[copyId]=full;
    outRow.querySelector('.msgmeta').innerHTML=`<span>${fmtTime(aiMsg.time)}</span><button class="copyMsg" data-copy="${copyId}">📋 Copier</button>`;
    store.claudeMsgs.push(aiMsg);save();
  }
  $('claudeSend').disabled=false;busy=false;if($('cst')&&$('cst').textContent.startsWith('⏳'))$('cst').textContent='';
  i.focus();
}

})();
